server {
    listen 80;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;

    ssl_certificate /etc/letsencrypt/live/rtc.systitsoft.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.systitsoft.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Core Portal Application
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listmonk — proxied under /listmonk/
    # Uses sub_filter to rewrite absolute URLs in Listmonk's HTML
    # so links like /admin/login become /listmonk/admin/login
    location /listmonk/ {
        proxy_pass http://listmonk:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite absolute path redirects from Listmonk
        proxy_redirect / /listmonk/;
        proxy_redirect /admin /listmonk/admin;
        proxy_redirect /subscription /listmonk/subscription;

        # Rewrite absolute paths in HTML (href/src attributes)
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/admin"' 'href="/listmonk/admin"';
        sub_filter "href='/admin'" "href='/listmonk/admin'";
        sub_filter 'href="/subscription"' 'href="/listmonk/subscription"';
        sub_filter "href='/subscription'" "href='/listmonk/subscription'";
        sub_filter 'href="/public/' 'href="/listmonk/public/';
        sub_filter "href='/public/" "href='/listmonk/public/";
        sub_filter 'src="/public/' 'src="/listmonk/public/';
        sub_filter "src='/public/" "src='/listmonk/public/";
        sub_filter 'action="/admin' 'action="/listmonk/admin';
        sub_filter "action='/admin" "action='/listmonk/admin";
        # Rewrite admin static assets loaded by Listmonk's SPA
        sub_filter 'src="/admin/' 'src="/listmonk/admin/';
        sub_filter "src='/admin/" "src='/listmonk/admin/";
        sub_filter 'href="/admin/' 'href="/listmonk/admin/';
        sub_filter "href='/admin/" "href='/listmonk/admin/";
    }

    # Listmonk static assets reroute
    location /listmonk/public/ {
        proxy_pass http://listmonk:9000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listmonk admin SPA assets (JS/CSS/custom files loaded at /admin/ paths)
    location /listmonk/admin/ {
        proxy_pass http://listmonk:9000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}