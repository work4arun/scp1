server {
    listen 80;
    server_name rathinam.xyz www.rathinam.xyz;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rathinam.xyz www.rathinam.xyz;

    ssl_certificate /etc/letsencrypt/live/rathinam.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rathinam.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Core Portal Application
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listmonk — proxied under /listmonk/ path
    location /listmonk/ {
        proxy_pass http://listmonk:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}