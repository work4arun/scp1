# Strategic Control Portal — production stack with SSL
# Services: db (Postgres 16), app (Next.js), nginx (SSL proxy)
# Email via Nodemailer (configured in Admin → Email Configuration)

services:
  db:
    image: postgres:16-alpine
    container_name: scp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scp_db}
      POSTGRES_USER: ${POSTGRES_USER:-scp_user1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - scp_pgdata:/var/lib/postgresql/data
    networks:
      - scp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scp_user1} -d ${POSTGRES_DB:-scp_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    x-bake:
      cache-from:
        - type=local,src=/tmp/.buildx-cache
      cache-to:
        - type=local,dest=/tmp/.buildx-cache,mode=max
    image: scp-app:latest
    container_name: scp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-scp_user1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scp_db}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NODE_ENV: production
      PORT: "3000"
      SCP_SEED: ${SCP_SEED:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "3000:3000"
    networks:
      - scp_net

  nginx:
    image: nginx:alpine
    container_name: scp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - scp_net

volumes:
  scp_pgdata:
    name: scp_pgdata

networks:
  scp_net:
    name: scp_net
    driver: bridge