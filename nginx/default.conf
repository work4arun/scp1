# ── Strategic Control Portal ────────────────────────────────────────
server {
    listen 80;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;

    ssl_certificate /etc/letsencrypt/live/rtc.systitsoft.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.systitsoft.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}