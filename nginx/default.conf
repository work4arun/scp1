server {
    listen 80;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rtc.systitsoft.in www.rtc.systitsoft.in;

    ssl_certificate /etc/letsencrypt/live/rtc.systitsoft.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.systitsoft.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Listmonk routes — catch ALL sub-paths at root level ──────────────
    # These location blocks precede the catch-all `/` so Nginx's
    # longest-prefix matching routes everything Listmonk to the listmonk
    # container. No sub_filter needed — the paths work as-is.
    location /admin {
        proxy_pass http://listmonk:9000/admin;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://listmonk:9000/admin/;
        proxy_set_header Host $host;
    }
    location /public/ {
        proxy_pass http://listmonk:9000/public/;
        proxy_set_header Host $host;
    }
    location /subscription {
        proxy_pass http://listmonk:9000/subscription;
        proxy_set_header Host $host;
    }
    location /subscription/ {
        proxy_pass http://listmonk:9000/subscription/;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://listmonk:9000/api/;
        proxy_set_header Host $host;
    }

    # ── Core Portal (Next.js) ────────────────────────────────────────────
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Listmonk main entry under /listmonk/ ────────────────────────────
    location /listmonk/ {
        proxy_pass http://listmonk:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite redirect paths (e.g. /admin -> /listmonk/admin)
        proxy_redirect / /listmonk/;
        proxy_redirect /admin /listmonk/admin;
        proxy_redirect /subscription /listmonk/subscription;
    }
}