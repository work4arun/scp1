# Strategic Control Portal — production stack with Listmonk email
#
# Three-optional-four containers on a private network:
#   - db   : Postgres 16 (NO host port published; only internal containers can reach it)
#   - app  : Next.js, bound directly to port 80 on the host to serve via IP
#   - listmonk : Listmonk email campaign manager on port 9000
#
# Listmonk uses the SAME db container (with a separate database 'listmonk').
# Listmonk admin UI is available at http://<HOST>:9000 and embedded via iframe
# at /sm/emails for Strategic Manager users.

services:
  db:
    image: postgres:16-alpine
    container_name: scp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scp}
      POSTGRES_USER: ${POSTGRES_USER:-scp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - scp_pgdata:/var/lib/postgresql/data
    networks:
      - scp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scp} -d ${POSTGRES_DB:-scp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scp-app:latest
    container_name: scp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-scp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scp}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NODE_ENV: production
      PORT: "3000"
      SCP_SEED: ${SCP_SEED:-0}
      # ── Email via Listmonk ──────────────────────────────────────────
      LISTMONK_URL: ${LISTMONK_URL:-http://listmonk:9000}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-admin}
      LISTMONK_API_PASSWORD: ${LISTMONK_API_PASSWORD:-listmonk}
      # ── Fallback SMTP (disabled by default) ────────────────────────
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "80:3000"
    networks:
      - scp_net

  # ── Listmonk email campaign manager ──────────────────────────────
  listmonk:
    image: listmonk/listmonk:latest
    container_name: scp-listmonk
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__user: ${POSTGRES_USER:-scp}
      LISTMONK_db__password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      LISTMONK_db__database: listmonk
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      TZ: Etc/UTC
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-listmonk}
    volumes:
      - listmonk_uploads:/listmonk/uploads:rw
    networks:
      - scp_net

volumes:
  scp_pgdata:
    name: scp_pgdata
  listmonk_uploads:
    name: listmonk_uploads

networks:
  scp_net:
    name: scp_net
    driver: bridge