name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/scp_project/scp1
            # Update the checkout BEFORE running deploy-all.sh so the deploy
            # script itself is the latest version (running a stale deploy-all.sh
            # used the old config for the whole run even after it pulled).
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            bash deploy-all.sh
