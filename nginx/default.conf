# ── Stalwart Mail Server (separate subdomain) ─────────────────────
server {
    listen 80;
    server_name mailserver.systitsoft.in www.mailserver.systitsoft.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mailserver.systitsoft.in www.mailserver.systitsoft.in;

    ssl_certificate /etc/letsencrypt/live/mailserver.systitsoft.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailserver.systitsoft.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect root to admin panel
    location = / {
        return 302 /admin/;
    }

    location / {
        proxy_pass http://stalwart:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}